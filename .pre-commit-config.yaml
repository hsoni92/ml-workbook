# Skip generated / internal storage paths misclassified as text (Hudi, Spark checkpoints).
exclude: (?x)(
  /\.hoodie/|/_spark_metadata/|/datalake/.*/checkpoints/|
  \.enc$
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: debug-statements
      - id: check-added-large-files
        args: ["--maxkb=36631"]

  - repo: local
    hooks:
      - id: secure-vault
        name: secure vault (verify encrypted + staged check)
        entry: python scripts/secure_vault.py pre-commit
        language: python
        additional_dependencies: [cryptography, pyyaml]
        pass_filenames: false
        always_run: true
        require_serial: true

      - id: validate-mermaid
        name: validate mermaid diagrams (maid)
        description: >
          Parse every Mermaid block in staged *.md files using @probelabs/maid
          (Chevrotain-based validator with the same render guarantee as Mermaid.js,
          no browser required). Run `make mermaid-setup` once after cloning to
          install the Node dependency.
        entry: node scripts/validate-mermaid.js
        language: system
        files: '(?i)\.(md|markdown)$'
        pass_filenames: true
        require_serial: false
